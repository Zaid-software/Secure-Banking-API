{% extends "base.html" %}
{% block title %}Login — SecureBank{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>🏦 SecureBank</h1>
  <h2>Sign In</h2>

  <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             required maxlength="100" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             required maxlength="200" autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
  </form>

  <p class="auth-link">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
  </p>
</div>
{% endblock %}
