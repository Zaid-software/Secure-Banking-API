{% extends "base.html" %}
{% block title %}Transfer — SecureBank{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>↔ Transfer Funds</h2>
  <form method="POST" action="{{ url_for('transactions.transfer') }}">
    <div class="form-group">
      <label for="destination">Destination Account Number</label>
      <input type="text" id="destination" name="destination"
             required maxlength="20" placeholder="e.g. 1234567890">
    </div>
    <div class="form-group">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" name="amount"
             min="0.01" max="50000" step="0.01"
             placeholder="0.00" required>
    </div>
    <div class="form-group">
      <label for="description">Description (optional)</label>
      <input type="text" id="description" name="description" maxlength="200">
    </div>
    <button type="submit" class="btn btn-primary btn-full">Transfer</button>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary btn-full">Cancel</a>
  </form>
</div>
{% endblock %}
