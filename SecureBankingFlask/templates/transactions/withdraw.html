{% extends "base.html" %}
{% block title %}Withdraw — SecureBank{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>⬆ Withdraw Funds</h2>
  <form method="POST" action="{{ url_for('transactions.withdraw') }}">
    <div class="form-group">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" name="amount"
             min="0.01" max="50000" step="0.01"
             placeholder="0.00" required>
    </div>
    <div class="form-group">
      <label for="description">Description (optional)</label>
      <input type="text" id="description" name="description" maxlength="200">
    </div>
    <button type="submit" class="btn btn-danger btn-full">Withdraw</button>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary btn-full">Cancel</a>
  </form>
</div>
{% endblock %}
